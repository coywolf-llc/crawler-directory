name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild dist from source and compare
        run: python3 scripts/build.py --check
      - name: Validate the published list
        run: python3 scripts/validate.py
      - name: Tests
        run: python3 -m unittest discover -s tests -v
